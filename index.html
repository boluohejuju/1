<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>真实 AR 平面放置 · 手势抓取模型</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #fff;
    -webkit-user-select: none; user-select: none; touch-action: none; }
  #stage { position: relative; width: 100vw; height: 100vh; }

  #video, #canvas, #three-canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }

  #video { z-index: 1; }
  #three-canvas { z-index: 2; pointer-events: none; }
  #canvas { z-index: 3; pointer-events: none; }
  #ar-overlay { position: absolute; inset: 0; z-index: 4; }

  #status {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: rgba(255,255,255,0.9); letter-spacing: 0.05em;
    z-index: 10; padding: 6px 14px; background: rgba(0,0,0,0.65); border-radius: 999px;
    white-space: nowrap; font-family: ui-monospace, monospace;
    pointer-events: none;
  }
  #hint {
    position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%);
    padding: 10px 22px; background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 999px;
    font-size: 13px; color: rgba(255,255,255,0.85);
    transition: opacity 0.6s; z-index: 10; text-align: center; white-space: nowrap;
    pointer-events: none;
  }
  .btn {
    position: absolute;
    padding: 7px 14px; background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 999px;
    font-size: 11px; color: rgba(255,255,255,0.9); cursor: pointer;
    z-index: 10; user-select: none; white-space: nowrap;
  }
  .btn:active { background: rgba(255,255,255,0.25); }

  #resetBtn { top: 20px; left: 16px; display: none; }
  #debugBtn { top: 20px; right: 100px; background: rgba(255, 100, 0, 0.3); border-color: rgba(255, 100, 0, 0.5); }
  #toggleSkeleton { top: 20px; right: 16px; }

  #debugPanel {
    position: absolute; top: 60px; right: 16px; z-index: 50;
    background: rgba(20, 20, 20, 0.95);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 12px;
    padding: 16px; width: 280px;
    display: none; flex-direction: column; gap: 12px;
  }
  .debug-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
  .debug-row input[type="range"] { width: 120px; }
  #debugOutput {
    background: #000; padding: 8px; border-radius: 6px; font-family: monospace; font-size: 11px;
    color: #4ade80; white-space: pre-wrap; word-break: break-all; user-select: text; margin-top: 5px;
  }

  #reticle {
    position: absolute; top: 50%; left: 50%;
    width: 60px; height: 60px; margin-left: -30px; margin-top: -30px;
    border: 2px solid rgba(255,255,255,0.45); border-radius: 50%;
    z-index: 6; pointer-events: none; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.04); transition: all 0.2s;
  }
  #reticle.active { border-color: #4ade80; background: rgba(74,222,128,0.12); transform: scale(1.08); }

  #startOverlay {
    position: absolute; inset: 0; z-index: 100;
    background: radial-gradient(circle at 50% 35%, #1a1030, #000 75%);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .start-card {
    max-width: 340px; width: 100%; text-align: center; padding: 28px 24px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 22px; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  .start-card h1 { font-size: 21px; font-weight: 700; margin-bottom: 12px; }
  .start-card p { font-size: 13px; line-height: 1.65; color: rgba(255,255,255,0.72); margin-bottom: 20px; }
  #startBtn {
    width: 100%; padding: 14px 0; font-size: 15px; font-weight: 700; color: #0a0a0a;
    background: linear-gradient(135deg, #a7f3d0, #6ee7b7); border: none; border-radius: 14px; cursor: pointer;
  }
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="three-canvas"></canvas>
  <canvas id="canvas"></canvas>
  <div id="ar-overlay"></div>
  <div id="reticle"></div>

  <div id="status">正在初始化...</div>
  <div id="hint">将手机对准桌面 · 点击屏幕放置模型</div>

  <div class="btn" id="resetBtn">↺ 重新放置</div>
  <div class="btn" id="debugBtn">⚙️ 参数调整</div>
  <div class="btn" id="toggleSkeleton">骨架 OFF</div>

  <div id="debugPanel">
    <div class="debug-row">
      <span>相机高度 (Y)</span>
      <input type="range" id="camYSlider" min="-3.0" max="3.0" step="0.1" value="0.0">
      <span id="camYVal">0.0</span>
    </div>
    <div class="debug-row">
      <span>相机俯角</span>
      <input type="range" id="camPitchSlider" min="-90" max="90" step="1" value="0">
      <span id="camPitchVal">0°</span>
    </div>
    <div class="debug-row">
      <span>视场角 FOV</span>
      <input type="range" id="fovSlider" min="30" max="110" step="1" value="60">
      <span id="fovVal">60°</span>
    </div>
    <div class="debug-row">
      <span>地面高度 (Y)</span>
      <input type="range" id="groundYSlider" min="-5.0" max="0.0" step="0.1" value="-2.0">
      <span id="groundYVal">-2.0</span>
    </div>
    <div class="debug-row">
      <span>模型缩放</span>
      <input type="range" id="scaleSlider" min="0" max="10" step="0.01" value="0.27">
      <span id="scaleVal">0.27</span>
    </div>
    <div class="debug-row">
      <span>抓取屏幕距离</span>
      <input type="range" id="grabDistSlider" min="0.05" max="0.6" step="0.01" value="0.28">
      <span id="grabDistVal">0.28</span>
    </div>
    <div class="debug-row">
      <span>握拳阈值</span>
      <input type="range" id="grabRatioSlider" min="0.8" max="2.5" step="0.05" value="1.6">
      <span id="grabRatioVal">1.60</span>
    </div>
    <div id="debugOutput">const CONFIG = {<br>  SCALE: 0.27,<br>  GROUND_Y: -2.0,<br>  CAMERA_Y: 0.0,<br>  CAMERA_PITCH: 0,<br>  CAMERA_FOV: 60<br>};</div>
  </div>

  <div id="startOverlay">
    <div class="start-card">
      <h1>🏢 AR 模型抓取</h1>
      <p>将手机摄像头向下对准桌面<br>点击屏幕把模型放到桌上<br>然后伸出手，合拢五指把它抓起来</p>
      <button id="startBtn">开始体验</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/@mediapipe/hands/hands.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

let CONFIG = {
  SCALE: 0.27,
  GROUND_Y: -2.0,
  CAMERA_Y: 0.0,
  CAMERA_PITCH: 0,
  CAMERA_FOV: 60,
  GRAB_DISTANCE_RATIO: 1.6,
  RELEASE_DISTANCE_RATIO: 2.0,
  GRAB_SCREEN_DIST: 0.28,
};

const MODEL_URL = 'https://raw.githubusercontent.com/boluohejuju/1/refs/heads/main/building.glb';

const video    = document.getElementById('video');
const canvas   = document.getElementById('canvas');
const ctx      = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const hintEl   = document.getElementById('hint');
const threeCanvas = document.getElementById('three-canvas');
const overlayEl = document.getElementById('ar-overlay');
const reticleEl = document.getElementById('reticle');
const resetBtn = document.getElementById('resetBtn');

const debugBtn = document.getElementById('debugBtn');
const debugPanel = document.getElementById('debugPanel');
const debugOutput = document.getElementById('debugOutput');

debugBtn.addEventListener('click', () => {
  debugPanel.style.display = debugPanel.style.display === 'flex' ? 'none' : 'flex';
});

function updateOutput() {
  debugOutput.innerHTML = `const CONFIG = {<br>  SCALE: ${CONFIG.SCALE.toFixed(2)},<br>  GROUND_Y: ${CONFIG.GROUND_Y.toFixed(1)},<br>  CAMERA_Y: ${CONFIG.CAMERA_Y.toFixed(1)},<br>  CAMERA_PITCH: ${CONFIG.CAMERA_PITCH.toFixed(0)},<br>  CAMERA_FOV: ${CONFIG.CAMERA_FOV.toFixed(0)}<br>};`;
}

document.getElementById('camYSlider').addEventListener('input', (e) => { CONFIG.CAMERA_Y = parseFloat(e.target.value); document.getElementById('camYVal').innerText = CONFIG.CAMERA_Y.toFixed(1); updateOutput(); });
document.getElementById('camPitchSlider').addEventListener('input', (e) => { CONFIG.CAMERA_PITCH = parseFloat(e.target.value); document.getElementById('camPitchVal').innerText = CONFIG.CAMERA_PITCH + '°'; updateOutput(); });
document.getElementById('fovSlider').addEventListener('input', (e) => { CONFIG.CAMERA_FOV = parseFloat(e.target.value); document.getElementById('fovVal').innerText = CONFIG.CAMERA_FOV + '°'; camera.fov = CONFIG.CAMERA_FOV; camera.updateProjectionMatrix(); updateOutput(); });
document.getElementById('groundYSlider').addEventListener('input', (e) => { CONFIG.GROUND_Y = parseFloat(e.target.value); document.getElementById('groundYVal').innerText = CONFIG.GROUND_Y.toFixed(1); gridHelper.position.y = CONFIG.GROUND_Y; updateOutput(); });
document.getElementById('scaleSlider').addEventListener('input', (e) => {
  CONFIG.SCALE = parseFloat(e.target.value);
  document.getElementById('scaleVal').innerText = CONFIG.SCALE.toFixed(2);
  if (flowerObj) {
    const box1 = new THREE.Box3().setFromObject(flowerObj);
    const s1 = box1.getSize(new THREE.Vector3());
    const max1 = Math.max(s1.x, s1.y, s1.z) || 1;
    const k = CONFIG.SCALE / max1;
    flowerObj.scale.setScalar(k);
    const box2 = new THREE.Box3().setFromObject(flowerObj);
    const s2 = box2.getSize(new THREE.Vector3());
    objRadius = Math.max(s2.x, s2.y, s2.z) * 0.5;
  }
  updateOutput();
});
document.getElementById('grabDistSlider').addEventListener('input', (e) => {
  CONFIG.GRAB_SCREEN_DIST = parseFloat(e.target.value);
  document.getElementById('grabDistVal').innerText = CONFIG.GRAB_SCREEN_DIST.toFixed(2);
});
document.getElementById('grabRatioSlider').addEventListener('input', (e) => {
  CONFIG.GRAB_DISTANCE_RATIO = parseFloat(e.target.value);
  document.getElementById('grabRatioVal').innerText = CONFIG.GRAB_DISTANCE_RATIO.toFixed(2);
});
updateOutput();

const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
const VIDEO_W = IS_MOBILE ? 640 : 1280;
const VIDEO_H = IS_MOBILE ? 480 : 720;
const MP_W = 160; const MP_H = 120;

const HIGHLIGHT_POINTS = [4, 8, 12, 16, 20, 0];
const HAND_CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

let layout = { offsetX: 0, offsetY: 0, drawW: 1, drawH: 1 };
function updateLayout() {
  const vw = video.videoWidth || VIDEO_W, vh = video.videoHeight || VIDEO_H;
  const cssW = window.innerWidth, cssH = window.innerHeight;
  const DPR = window.devicePixelRatio || 1;
  if (canvas.width !== cssW * DPR || canvas.height !== cssH * DPR) {
    canvas.width = cssW * DPR; canvas.height = cssH * DPR;
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const videoAspect = vw / vh, displayAspect = cssW / cssH;
  let drawW, drawH, offsetX, offsetY;
  if (displayAspect > videoAspect) {
    drawW = cssW; drawH = cssW / videoAspect; offsetX = 0; offsetY = (cssH - drawH) / 2;
  } else {
    drawH = cssH; drawW = cssH * videoAspect; offsetX = (cssW - drawW) / 2; offsetY = 0;
  }
  layout = { offsetX, offsetY, drawW, drawH };
}
window.addEventListener('resize', () => { updateLayout(); onWindowResize(); });
window.addEventListener('orientationchange', () => setTimeout(() => { updateLayout(); onWindowResize(); }, 250));

function nToC(nx, ny) {
  return { x: layout.offsetX + nx * layout.drawW, y: layout.offsetY + ny * layout.drawH };
}

const mpCanvas = document.createElement('canvas');
mpCanvas.width = MP_W; mpCanvas.height = MP_H;
const mpCtx = mpCanvas.getContext('2d', { alpha: false });
const handSlots = { right: { lms: null }, left: { lms: null } };

function getHandCenter(lms) { return { x: (lms[0].x + lms[9].x) / 2, y: (lms[0].y + lms[9].y) / 2 }; }

function processHands(results) {
  const lmsArr = results.multiHandLandmarks || [];
  let rightDet = null, leftDet = null;
  if (lmsArr.length >= 2) {
    const sorted = [...lmsArr].sort((a, b) => getHandCenter(a).x - getHandCenter(b).x);
    rightDet = sorted[0]; leftDet = sorted[1];
  } else if (lmsArr.length === 1) {
    const lms = lmsArr[0], c = getHandCenter(lms);
    if (c.x < 0.5) rightDet = lms; else leftDet = lms;
  }
  handSlots.right.lms = rightDet;
  handSlots.left.lms = leftDet;
}

let handsInstance = null, mpBusy = false, lastMpTime = 0, mpReady = false;
async function initHands() {
  if (typeof Hands === 'undefined') return;
  const hands = new Hands({ locateFile: (f) => `https://unpkg.com/@mediapipe/hands/${f}` });
  hands.setOptions({ maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.4, selfieMode: false });
  hands.onResults((r) => processHands(r));
  try { await hands.initialize(); handsInstance = hands; mpReady = true; } catch (e) { console.error(e); }
}

function pumpMP() {
  if (mpBusy || !mpReady || video.readyState < 2) return;
  const now = performance.now();
  if (now - lastMpTime < 66) return;
  mpBusy = true; lastMpTime = now;
  mpCtx.drawImage(video, 0, 0, MP_W, MP_H);
  handsInstance.send({ image: mpCanvas }).then(() => { mpBusy = false; }).catch(() => { mpBusy = false; });
}

async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: VIDEO_W }, height: { ideal: VIDEO_H } }, audio: false,
    });
    video.srcObject = stream;
    await video.play();
    if (video.videoWidth) updateLayout();
    video.addEventListener('loadedmetadata', updateLayout);
    return true;
  } catch (e) {
    statusEl.textContent = '摄像头失败：' + e.name;
    return false;
  }
}

// Three.js
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(CONFIG.CAMERA_FOV, window.innerWidth / window.innerHeight, 0.05, 200);
const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 1.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);
scene.add(new THREE.AmbientLight(0xffffff, 1.0));

const gridHelper = new THREE.GridHelper(10, 10, 0x00ff00, 0x444444);
gridHelper.position.y = CONFIG.GROUND_Y;
scene.add(gridHelper);

let gyroReady = false;
let baseQuat = new THREE.Quaternion();

function onDeviceOrientation(e) {
  if (e.alpha === null || e.beta === null || e.gamma === null) return;
  const alpha = THREE.MathUtils.degToRad(e.alpha);
  const beta  = THREE.MathUtils.degToRad(e.beta);
  const gamma = THREE.MathUtils.degToRad(e.gamma);
  const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
  baseQuat.setFromEuler(euler);
  baseQuat.multiply(new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)));
  let angle = 0;
  if (screen.orientation && typeof screen.orientation.angle === 'number') angle = screen.orientation.angle;
  else if (typeof window.orientation === 'number') angle = window.orientation;
  baseQuat.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), -THREE.MathUtils.degToRad(angle)));
  gyroReady = true;
}

function createShadowTexture() {
  const c = document.createElement('canvas'); c.width = 128; c.height = 128;
  const ct = c.getContext('2d');
  const gradient = ct.createRadialGradient(64, 64, 0, 64, 64, 64);
  gradient.addColorStop(0, 'rgba(0, 0, 0, 0.9)');
  gradient.addColorStop(0.4, 'rgba(0, 0, 0, 0.5)');
  gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ct.fillStyle = gradient; ct.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const shadowMaterial = new THREE.MeshBasicMaterial({ map: createShadowTexture(), transparent: true, opacity: 0.6, depthWrite: false });
const shadowMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), shadowMaterial);
shadowMesh.rotation.x = -Math.PI / 2;
shadowMesh.position.y = CONFIG.GROUND_Y + 0.01;
shadowMesh.visible = false;
scene.add(shadowMesh);

const raycaster = new THREE.Raycaster();
const tmpHit = new THREE.Vector3();
const tmpNdc = new THREE.Vector2();

function screenToGround(clientX, clientY) {
  tmpNdc.set((clientX / window.innerWidth) * 2 - 1, -(clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(tmpNdc, camera);
  const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -CONFIG.GROUND_Y);
  const hitPoint = new THREE.Vector3();
  const ok = raycaster.ray.intersectPlane(groundPlane, hitPoint);
  if (!ok) return null;
  const dist = hitPoint.distanceTo(camera.position);
  if (dist > 0.1 && dist < 30) {
    if (hitPoint.y < CONFIG.GROUND_Y - 5) return null;
    return hitPoint.clone();
  }
  return null;
}

const GRAVITY = -2.8;
const AIR_DRAG_Y = 0.9;
const AIR_DRAG_X = 1.2;
const BOUNCE_RESTITUTION = 0.35;
const MAX_BOUNCE_COUNT = 2;
const MIN_BOUNCE_SPEED = 0.4;

const objState = {
  position: new THREE.Vector3(0, CONFIG.GROUND_Y, -2),
  velocity: new THREE.Vector3(0, 0, 0),
  isHeld: false,
  isFalling: false,
  isResting: true,
  releaseCooldown: 0,
  bounceCount: 0,
  wobbleTime: 0
};
let flowerObj = null, objRadius = 0.1, modelLoaded = false;
let modelVisible = false;
let placingMode = true;
const grabPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
let currentObjGroup = null;

// 创建一个明显的占位模型（蓝色八面体），页面打开即可放置
function createPlaceholder() {
  const group = new THREE.Group();
  const geo = new THREE.OctahedronGeometry(0.4, 0);
  const mat = new THREE.MeshStandardMaterial({ color: 0x4a90d9, roughness: 0.4, metalness: 0.3 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.y = 0.4;
  group.add(mesh);
  return group;
}

function setupObject(obj) {
  if (currentObjGroup) {
    scene.remove(currentObjGroup);
    currentObjGroup.traverse((child) => {
      if (child.geometry) child.geometry.dispose();
      if (child.material) {
        if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
        else child.material.dispose();
      }
    });
    currentObjGroup = null;
  }

  flowerObj = obj;
  const box = new THREE.Box3().setFromObject(flowerObj);
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const k = CONFIG.SCALE / maxDim;
  flowerObj.scale.setScalar(k);

  const box2 = new THREE.Box3().setFromObject(flowerObj);
  const center2 = box2.getCenter(new THREE.Vector3());
  flowerObj.position.sub(center2);

  const objGroup = new THREE.Group();
  objGroup.add(flowerObj);
  objGroup.visible = false;
  scene.add(objGroup);

  currentObjGroup = objGroup;
  flowerObj = objGroup;

  const box3 = new THREE.Box3().setFromObject(flowerObj);
  const size3 = box3.getSize(new THREE.Vector3());
  objRadius = Math.max(size3.x, size3.y, size3.z) * 0.5;
  modelLoaded = true;
}

// ★ 关键：页面一打开就创建占位模型并设为已加载，保证点击永远可以放置
setupObject(createPlaceholder());
statusEl.textContent = '占位模型就绪 · 正在加载 building.glb';

// 后台加载 building.glb，成功后替换占位模型
const loader = new GLTFLoader();
loader.load(
  MODEL_URL,
  (gltf) => {
    setupObject(gltf.scene);
    statusEl.textContent = 'building.glb 加载成功';
    console.log('building.glb 加载成功');
  },
  (xhr) => {
    if (xhr.total > 0) {
      statusEl.textContent = `加载 building.glb ${Math.round((xhr.loaded / xhr.total) * 100)}%`;
    }
  },
  (err) => {
    console.error('building.glb 加载失败:', err);
    statusEl.textContent = 'building.glb 加载失败，继续使用占位模型';
  }
);

function getActiveHand() { return handSlots.right.lms || handSlots.left.lms || null; }
function getPalmPoint(lms) { return lms[9]; }
function getPalmSize(lms) { return Math.hypot(lms[9].x - lms[0].x, lms[9].y - lms[0].y) || 0.1; }

function isFullyGrabbed(lms) {
  if (!lms) return false;
  const p = getPalmSize(lms);
  const wrist = lms[0];
  const tips = [4, 8, 12, 16, 20];
  let closedCount = 0;
  for (const idx of tips) {
    const tip = lms[idx];
    const d = Math.hypot(tip.x - wrist.x, tip.y - wrist.y) / p;
    if (d < CONFIG.GRAB_DISTANCE_RATIO) closedCount++;
  }
  return closedCount >= 4;
}

function isHandOpen(lms) {
  if (!lms) return true;
  const p = getPalmSize(lms);
  const wrist = lms[0];
  const tips = [8, 12, 16, 20];
  let openCount = 0;
  for (const idx of tips) {
    const tip = lms[idx];
    const d = Math.hypot(tip.x - wrist.x, tip.y - wrist.y) / p;
    if (d > CONFIG.RELEASE_DISTANCE_RATIO) openCount++;
  }
  return openCount >= 3;
}

function releaseObject() {
  objState.isHeld = false;
  objState.isFalling = true;
  objState.isResting = false;
  objState.releaseCooldown = 0.6;
  objState.bounceCount = 0;
  objState.wobbleTime = 0;
  objState.velocity.set((Math.random() - 0.5) * 0.4, 0, 0);
}

function getObjectScreenPos() {
  const p = objState.position.clone().project(camera);
  return { x: (1 + p.x) / 2, y: (1 - p.y) / 2 };
}

function getHandScreenPos(lms) {
  const pt = getPalmPoint(lms);
  return { x: pt.x, y: pt.y };
}

const tmpPlane = new THREE.Plane();
const tmpNormal = new THREE.Vector3();
const tmpV = new THREE.Vector3();

function handScreenToWorld(lms) {
  if (!lms) return null;
  const pt = getPalmPoint(lms);
  const ndcX = pt.x * 2 - 1;
  const ndcY = -(pt.y * 2 - 1);

  camera.getWorldDirection(tmpNormal);
  tmpPlane.setFromNormalAndCoplanarPoint(tmpNormal, objState.position);

  raycaster.setFromCamera(tmpNdc.set(ndcX, ndcY), camera);
  const hit = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(tmpPlane, hit)) {
    return hit;
  }
  const dist = camera.position.distanceTo(objState.position);
  tmpV.set(ndcX, ndcY, 0.5).unproject(camera);
  tmpV.sub(camera.position).normalize();
  return camera.position.clone().add(tmpV.multiplyScalar(dist));
}

function updateLogic(deltaTime) {
  if (!modelLoaded || !modelVisible) return '';
  if (objState.releaseCooldown > 0) objState.releaseCooldown -= deltaTime;

  const activeHand = getActiveHand();
  let debugStr = '无手';
  let debugInfo = '';

  if (objState.isHeld) {
    if (!activeHand) {
      releaseObject();
      debugStr = '手消失·释放';
    } else if (isHandOpen(activeHand)) {
      releaseObject();
      debugStr = '松手飘落';
    } else {
      const targetPos = handScreenToWorld(activeHand);
      if (targetPos) objState.position.copy(targetPos);
      debugStr = '抓取中';
    }
  } else {
    if (activeHand && objState.releaseCooldown <= 0) {
      const grabbed = isFullyGrabbed(activeHand);
      const handScreen = getHandScreenPos(activeHand);
      const objScreen = getObjectScreenPos();
      const screenDist = Math.hypot(handScreen.x - objScreen.x, handScreen.y - objScreen.y);
      debugInfo = `握${grabbed?'✓':'✗'} 屏距${screenDist.toFixed(2)}`;

      if (grabbed) {
        if (screenDist < CONFIG.GRAB_SCREEN_DIST) {
          objState.isHeld = true;
          objState.isFalling = false;
          objState.isResting = false;
          objState.velocity.set(0, 0, 0);
          objState.bounceCount = 0;
          objState.wobbleTime = 0;
          const targetPos = handScreenToWorld(activeHand);
          if (targetPos) objState.position.copy(targetPos);
          debugStr = '抓取成功';
        } else {
          debugStr = '距离太远';
        }
      } else {
        debugStr = '手势未到位';
      }
    }

    if (!objState.isHeld && !objState.isResting) {
      objState.velocity.y += GRAVITY * deltaTime;
      objState.velocity.y *= Math.max(0, 1 - AIR_DRAG_Y * deltaTime);
      objState.velocity.x *= Math.max(0, 1 - AIR_DRAG_X * deltaTime);
      objState.velocity.z *= Math.max(0, 1 - AIR_DRAG_X * deltaTime);
      objState.position.addScaledVector(objState.velocity, deltaTime);

      const floorY = CONFIG.GROUND_Y + objRadius;
      if (objState.position.y <= floorY) {
        objState.position.y = floorY;
        if (objState.velocity.y < -MIN_BOUNCE_SPEED && objState.bounceCount < MAX_BOUNCE_COUNT) {
          objState.velocity.y = -objState.velocity.y * BOUNCE_RESTITUTION;
          objState.velocity.x *= 0.6;
          objState.velocity.z *= 0.6;
          objState.bounceCount++;
        } else {
          objState.velocity.set(0, 0, 0);
          objState.isResting = true;
          objState.isFalling = false;
        }
      }
    }
  }

  if (flowerObj) {
    flowerObj.position.copy(objState.position);
    if (objState.isHeld) {
      // 保持
    } else if (!objState.isResting) {
      objState.wobbleTime += deltaTime;
      const w = objState.wobbleTime;
      flowerObj.rotation.z = Math.sin(w * 2.4) * 0.12;
      flowerObj.rotation.x = Math.cos(w * 1.8) * 0.08;
    } else {
      const decay = Math.pow(0.02, deltaTime);
      flowerObj.rotation.z *= decay;
      flowerObj.rotation.x *= decay;
      flowerObj.rotation.y *= decay;
    }
  }

  if (shadowMesh) {
    const height = Math.max(objState.position.y - (CONFIG.GROUND_Y + objRadius), 0);
    const t = Math.min(height / 5, 1);
    const baseScale = objRadius * 3.0;
    const currentScale = baseScale * (1 - t * 0.5);
    shadowMesh.scale.set(currentScale, currentScale, 1);
    shadowMesh.position.x = objState.position.x;
    shadowMesh.position.z = objState.position.z;
    shadowMaterial.opacity = Math.max(0.6 * (1 - t * 0.8), 0.05);
  }

  return debugInfo ? debugStr + ' ' + debugInfo : debugStr;
}

function enterPlacingMode() {
  placingMode = true;
  modelVisible = false;
  if (flowerObj) flowerObj.visible = false;
  shadowMesh.visible = false;
  reticleEl.style.display = 'flex';
  hintEl.style.opacity = '1';
  hintEl.textContent = '将手机向下对准桌面 · 点击屏幕放置模型';
  statusEl.textContent = '🎯 对准桌面放置';
  resetBtn.style.display = 'none';
}

function placeAt(hit) {
  placingMode = false;
  modelVisible = true;
  objState.position.set(hit.x, CONFIG.GROUND_Y + objRadius, hit.z);
  objState.velocity.set(0, 0, 0);
  objState.isHeld = false;
  objState.isResting = true;
  objState.isFalling = false;
  if (flowerObj) {
    flowerObj.visible = true;
    flowerObj.position.copy(objState.position);
    flowerObj.rotation.set(0, 0, 0);
  }
  shadowMesh.visible = true;
  reticleEl.style.display = 'none';
  hintEl.textContent = '伸出手 · 五指合拢抓取模型';
  hintEl.style.opacity = '1';
  setTimeout(() => { hintEl.style.opacity = '0'; }, 4000);
  resetBtn.style.display = 'block';
  statusEl.textContent = '已放置 · 伸手抓取';
}

// ★ 修复：pointerdown 直接触发放置，不等待 pointerup，避免移动端事件丢失
overlayEl.addEventListener('pointerdown', (e) => {
  if (!placingMode) return;
  // modelLoaded 此时一定为 true（占位模型已就绪），不会拦截
  const hit = screenToGround(e.clientX, e.clientY);
  if (hit) {
    placeAt(hit);
  } else {
    hintEl.textContent = '未命中桌面 · 请把手机再向下倾斜';
    hintEl.style.opacity = '1';
  }
});

resetBtn.addEventListener('click', () => {
  enterPlacingMode();
});

let showSkeleton = false;
document.getElementById('toggleSkeleton').onclick = function() {
  showSkeleton = !showSkeleton;
  this.textContent = showSkeleton ? '骨架 ON' : '骨架 OFF';
};

function drawSkeleton(lms, isRight) {
  if (!lms) return;
  const strokeColor = isRight ? '#00ff44' : '#00d4ff';
  const tipColor = '#ffcc00', pointColor = '#ff1a1a';
  ctx.strokeStyle = strokeColor; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let k = 0; k < HAND_CONNECTIONS.length; k++) {
    const a = HAND_CONNECTIONS[k][0], b = HAND_CONNECTIONS[k][1];
    const pa = lms[a], pb = lms[b];
    if (!pa || !pb) continue;
    const A = nToC(pa.x, pa.y), B = nToC(pb.x, pb.y);
    ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y);
  }
  ctx.stroke();
  for (let idx = 0; idx < lms.length; idx++) {
    const p = lms[idx]; if (!p) continue;
    const P = nToC(p.x, p.y);
    ctx.fillStyle = HIGHLIGHT_POINTS.includes(idx) ? tipColor : pointColor;
    ctx.beginPath(); ctx.arc(P.x, P.y, HIGHLIGHT_POINTS.includes(idx) ? 5 : 3, 0, Math.PI * 2); ctx.fill();
  }
}

let lastFrameTime = performance.now();

function loop() {
  try {
    const now = performance.now();
    const deltaTime = Math.min((now - lastFrameTime) / 1000, 0.05);
    lastFrameTime = now;

    pumpMP();

    if (gyroReady) {
      camera.quaternion.copy(baseQuat);
      camera.rotateX(THREE.MathUtils.degToRad(CONFIG.CAMERA_PITCH));
    } else {
      camera.quaternion.setFromEuler(new THREE.Euler(THREE.MathUtils.degToRad(CONFIG.CAMERA_PITCH), 0, 0, 'YXZ'));
    }
    camera.position.set(0, CONFIG.CAMERA_Y, 0);
    camera.updateMatrixWorld(true);

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (showSkeleton) {
      if (handSlots.right.lms) drawSkeleton(handSlots.right.lms, true);
      if (handSlots.left.lms) drawSkeleton(handSlots.left.lms, false);
    }

    if (placingMode) {
      const hit = screenToGround(window.innerWidth / 2, window.innerHeight / 2);
      if (hit) {
        reticleEl.classList.add('active');
        hintEl.textContent = '平面已锁定 · 点击屏幕放置';
      } else {
        reticleEl.classList.remove('active');
        hintEl.textContent = '将手机向下对准桌面';
      }
    }

    const debugState = updateLogic(deltaTime) || '';
    renderer.render(scene, camera);

    if (placingMode) {
      statusEl.textContent = `🎯 对准桌面放置`;
    } else {
      const objStatus = objState.isHeld ? '🏢抓取中' : (objState.isFalling ? '⬇️飘落' : '⏸️静止');
      statusEl.textContent = `${debugState} · ${objStatus}`;
    }

    if ((handSlots.right.lms || handSlots.left.lms) && !placingMode) {
      hintEl.style.opacity = '0';
    }
  } catch (err) { console.error(err); }
  requestAnimationFrame(loop);
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
}
window.addEventListener('resize', onWindowResize);

document.getElementById('startBtn').addEventListener('click', async () => {
  const startBtn = document.getElementById('startBtn');
  startBtn.textContent = '请求陀螺仪权限...';
  startBtn.disabled = true;

  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      await DeviceOrientationEvent.requestPermission();
    }
  } catch (e) { }

  window.addEventListener('deviceorientation', onDeviceOrientation, true);

  startBtn.textContent = '请求摄像头...';
  const camOk = await initCamera();
  if (!camOk) return;

  initHands();
  document.getElementById('startOverlay').style.display = 'none';
  enterPlacingMode();
  loop();
});
</script>
