<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>极简 AR 立方体</title>
<style>
  body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
  #canvas { width: 100vw; height: 100vh; display: block; }
  #hint {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    color: white; background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 20px;
    font-size: 14px; pointer-events: none; text-align: center; z-index: 10; display: none;
  }
  #overlay {
    position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
  }
  #overlay h1 { color: #fff; margin-bottom: 10px; }
  #overlay p { color: #aaa; margin-bottom: 30px; text-align: center; padding: 0 20px; font-size: 14px;}
  #startBtn {
    padding: 15px 40px; font-size: 18px; font-weight: bold; border: none; border-radius: 10px;
    background: #4ade80; color: #000; cursor: pointer; transition: 0.3s;
  }
  #startBtn:disabled { background: #666; color: #aaa; cursor: not-allowed; }
  #errorText { color: #ff4d4d; margin-top: 20px; text-align: center; padding: 0 20px; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="hint">移动手机扫描桌面... 出现绿圈后点击屏幕</div>

<div id="overlay">
  <h1>极简 AR 体验</h1>
  <p>请确保手机已安装 AR 服务，并开启了网络工具。</p>
  <button id="startBtn">启动 AR</button>
  <div id="errorText"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('canvas');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);

const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.xr.enabled = true;

const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
light.position.set(0.5, 1, 0.25);
scene.add(light);

// 生成一个 20cm 的红色立方体
const geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
const material = new THREE.MeshStandardMaterial({ color: 0xff4d6d, roughness: 0.3 });
const cube = new THREE.Mesh(geometry, material);
cube.visible = false;
scene.add(cube);

// 准星
const reticle = new THREE.Mesh(
  new THREE.RingGeometry(0.05, 0.06, 32).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0x00ff00 })
);
reticle.visible = false;
reticle.matrixAutoUpdate = false;
scene.add(reticle);

let hitTestSource = null;
let localSpace = null;

// 点击放置
canvas.addEventListener('pointerdown', () => {
  if (reticle.visible) {
    cube.position.setFromMatrixPosition(reticle.matrix);
    cube.visible = true;
    reticle.visible = false;
    document.getElementById('hint').innerText = '放置成功！';
    setTimeout(() => document.getElementById('hint').style.display = 'none', 3000);
  }
});

// 启动 AR
document.getElementById('startBtn').addEventListener('click', async () => {
  const btn = document.getElementById('startBtn');
  const errText = document.getElementById('errorText');
  
  btn.textContent = '正在启动...';
  btn.disabled = true;
  errText.innerHTML = '';

  if (!navigator.xr) {
    errText.innerHTML = '当前浏览器不支持 WebXR。<br>请换用 Chrome 或 Edge。';
    btn.textContent = '启动失败'; btn.disabled = false;
    return;
  }

  try {
    // 极其精简的配置，只要 hit-test
    const session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test']
    });
    
    await renderer.xr.setSession(session);
    
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('hint').style.display = 'block';

    localSpace = await session.requestReferenceSpace('local');
    const viewerSpace = await session.requestReferenceSpace('viewer');
    
    hitTestSource = await session.requestHitTestSource({ space: viewerSpace });

    renderer.setAnimationLoop((time, frame) => {
      if (frame && hitTestSource) {
        const results = frame.getHitTestResults(hitTestSource);
        if (results.length > 0) {
          const pose = results[0].getPose(localSpace);
          reticle.visible = true;
          reticle.matrix.fromArray(pose.transform.matrix);
        } else {
          reticle.visible = false;
        }
      }
      renderer.render(scene, camera);
    });

  } catch (error) {
    console.error(error);
    errText.innerHTML = `启动失败，原因：<br><span style="color:#ffaa00">${error.message}</span><br><br>如果是 iOS，说明苹果屏蔽了第三方浏览器的底层 AR。<br>如果是安卓，请检查梯子和 ARCore 服务。`;
    btn.textContent = '重新尝试';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
