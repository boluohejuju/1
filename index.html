<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MediaPipe 手部骨架 + AR石头砸地 (后置)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #fff;
    -webkit-user-select: none; user-select: none; touch-action: none; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  #video, #canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  #video { z-index: 1; /* 移除 scaleX(-1)，后置不镜像 */ }
  #canvas { z-index: 2; pointer-events: none; }
  #three-canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 3; pointer-events: none;
  }
  #status {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: rgba(255,255,255,0.85); letter-spacing: 0.05em;
    z-index: 10; padding: 6px 14px; background: rgba(0,0,0,0.65); border-radius: 999px;
    white-space: nowrap; font-family: ui-monospace, monospace;
  }
  #hint {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    padding: 10px 24px; background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 999px;
    font-size: 13px; color: rgba(255,255,255,0.7);
    transition: opacity 0.6s; z-index: 10; text-align: center;
  }
  .btn {
    position: absolute;
    padding: 7px 14px; background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 999px;
    font-size: 11px; color: rgba(255,255,255,0.9); cursor: pointer;
    z-index: 10; user-select: none; white-space: nowrap;
  }
  .btn:active { background: rgba(255,255,255,0.25); }
  #toggleSkeleton { top: 20px; right: 16px; }
  #guide {
    position: absolute; top: 16px; left: 16px; z-index: 10;
    max-width: 244px;
    padding: 9px 12px 10px;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 14px;
    font-size: 11px; line-height: 1.55;
    color: rgba(255,255,255,0.85);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.35);
    user-select: none;
  }
  .guide-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; cursor: pointer;
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: #fff;
  }
  .guide-fold {
    font-size: 10px; font-weight: 400; color: rgba(255,255,255,0.55);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 999px; padding: 1px 7px;
  }
  .guide-body { margin-top: 7px; display: flex; flex-direction: column; gap: 3px; }
  .guide-row { display: flex; align-items: flex-start; gap: 6px; }
  .guide-row b { color: #fff; font-weight: 600; }

  #paramPanel {
    position: absolute; top: 60px; right: 16px; z-index: 20;
    width: 260px;
    background: rgba(20, 24, 30, 0.92);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 14px 16px 16px;
    font-size: 12px;
    color: rgba(255,255,255,0.9);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    display: flex; flex-direction: column; gap: 10px;
    max-height: calc(100vh - 140px);
    overflow-y: auto;
  }
  #paramPanel::-webkit-scrollbar { width: 4px; }
  #paramPanel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
  .param-row { display: flex; flex-direction: column; gap: 3px; }
  .param-row label {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: rgba(255,255,255,0.7);
  }
  .param-row label .val {
    font-family: ui-monospace, monospace;
    color: #00d4ff; font-weight: 600;
  }
  .param-row input[type="range"] {
    width: 100%; height: 4px; -webkit-appearance: none;
    background: rgba(255,255,255,0.15); border-radius: 2px; outline: none;
  }
  .param-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    background: #00d4ff; border-radius: 50%; cursor: pointer;
    box-shadow: 0 0 6px rgba(0,212,255,0.6);
  }
  .param-actions { display: flex; gap: 8px; margin-top: 4px; }
  .param-actions .btn {
    position: static; flex: 1; text-align: center; padding: 8px 0;
    font-size: 11px; border-radius: 8px;
  }
  .btn-copy { background: rgba(0, 212, 255, 0.18); border-color: rgba(0,212,255,0.4); color: #00d4ff; }
  .btn-copy:active { background: rgba(0, 212, 255, 0.3); }
  .btn-reset { background: rgba(255,255,255,0.08); }

  @media (max-width: 600px) {
    #guide { top: 58px; left: 10px; max-width: 58vw; font-size: 10px; padding: 8px 10px 9px; }
    #paramPanel { width: 210px; top: 52px; right: 8px; padding: 10px 12px 12px; font-size: 11px; }
  }
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <canvas id="three-canvas"></canvas>
  
  <div id="guide">
    <div class="guide-head" id="guideHead">
      <span>🪨 抓取石头</span>
      <span class="guide-fold" id="guideFold">收起</span>
    </div>
    <div class="guide-body" id="guideBody">
      <div class="guide-row"><span>1.</span><span>将手伸入<b>石头范围</b>内</span></div>
      <div class="guide-row"><span>2.</span><span><b>五指完全合拢</b>即可抓取</span></div>
      <div class="guide-row"><span>3.</span><span>移动手部，石头零延迟跟随</span></div>
      <div class="guide-row"><span>4.</span><span>手指张开，石头<b>重重砸下并弹跳两次</b></span></div>
    </div>
  </div>
  
  <div id="status">正在加载...</div>
  <div id="hint">请对准平面 · 伸入石头范围并五指合拢</div>
  <div class="btn" id="toggleSkeleton">骨架 OFF</div>

  <div id="paramPanel">
    <div style="font-size:13px; font-weight:700; letter-spacing:0.04em; margin-bottom:2px;">⚙️ 参数面板</div>
    <div class="param-row">
      <label>相机高度 (cameraY) <span class="val" id="vCameraY">4.0</span></label>
      <input type="range" id="sCameraY" min="-10" max="20" step="0.1" value="4.0">
    </div>
    <div class="param-row">
      <label>相机角度 (lookAt Y) <span class="val" id="vLookAtY">-2.0</span></label>
      <input type="range" id="sLookAtY" min="-10" max="10" step="0.1" value="-2.0">
    </div>
    <div class="param-row">
      <label>相机距离 (Z) <span class="val" id="vCameraZ">12.0</span></label>
      <input type="range" id="sCameraZ" min="2" max="30" step="0.5" value="12.0">
    </div>
    <div class="param-row">
      <label>模型大小 (scale) <span class="val" id="vModelScale">1.0</span></label>
      <input type="range" id="sModelScale" min="0.2" max="3.0" step="0.05" value="1.0">
    </div>
    <div class="param-row">
      <label>地面网格透明度 <span class="val" id="vGridOpacity">0.4</span></label>
      <input type="range" id="sGridOpacity" min="0" max="1" step="0.05" value="0.4">
    </div>
    <div class="param-actions">
      <div class="btn btn-copy" id="copyParams">📋 复制参数</div>
      <div class="btn btn-reset" id="resetParams">↺ 重置</div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
  }
}
</script><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const CONFIG = {
  GRAB_DISTANCE_RATIO: 1.35, 
  RELEASE_DISTANCE_RATIO: 1.7,
  GRAB_SCREEN_DIST: 0.12,
};

const video    = document.getElementById('video');
const canvas   = document.getElementById('canvas');
const ctx      = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const hintEl   = document.getElementById('hint');
const threeCanvas = document.getElementById('three-canvas');
document.getElementById('guideHead').addEventListener('click', () => {
  const body = document.getElementById('guideBody');
  const fold = document.getElementById('guideFold');
  const hidden = body.style.display === 'none';
  body.style.display = hidden ? 'flex' : 'none';
  fold.textContent = hidden ? '收起' : '展开';
});

const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile|HarmonyOS|HuaweiBrowser|HonorBrowser|MicroMessenger|WeChat/i.test(navigator.userAgent) || navigator.maxTouchPoints > 1;
const VIDEO_W = IS_MOBILE ? 1280 : 1280;
const VIDEO_H = IS_MOBILE ? 720 : 720;
const MP_W = IS_MOBILE ? 256 : 256;
const MP_H = IS_MOBILE ? 192 : 192;
const MP_INTERVAL_MS = IS_MOBILE ? 33 : 33;

const KP_NAMES = ['WRIST','THUMB_CMC','THUMB_MCP','THUMB_IP','THUMB_TIP','INDEX_MCP','INDEX_PIP','INDEX_DIP','INDEX_TIP','MIDDLE_MCP','MIDDLE_PIP','MIDDLE_DIP','MIDDLE_TIP','RING_MCP','RING_PIP','RING_DIP','RING_TIP','PINKY_MCP','PINKY_PIP','PINKY_DIP','PINKY_TIP'];
const HIGHLIGHT_POINTS = [4, 8, 12, 16, 20, 0];
const HAND_CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

let layout = { offsetX: 0, offsetY: 0, drawW: 1, drawH: 1 };
function updateLayout() {
  const vw = video.videoWidth || VIDEO_W, vh = video.videoHeight || VIDEO_H;
  const cssW = window.innerWidth, cssH = window.innerHeight;
  const DPR = window.devicePixelRatio || 1;
  if (canvas.width !== cssW * DPR || canvas.height !== cssH * DPR) {
    canvas.width = cssW * DPR; canvas.height = cssH * DPR;
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const videoAspect = vw / vh, displayAspect = cssW / cssH;
  let drawW, drawH, offsetX, offsetY;
  if (displayAspect > videoAspect) {
    drawW = cssW; drawH = cssW / videoAspect; offsetX = 0; offsetY = (cssH - drawH) / 2;
  } else {
    drawH = cssH; drawW = cssH * videoAspect; offsetX = (cssW - drawW) / 2; offsetY = 0;
  }
  layout = { offsetX, offsetY, drawW, drawH };
}
window.addEventListener('resize', updateLayout);
window.addEventListener('orientationchange', () => setTimeout(updateLayout, 200));
// 后置摄像头无需镜像坐标转换
function nToC(nx, ny) {
  return { x: layout.offsetX + nx * layout.drawW, y: layout.offsetY + ny * layout.drawH };
}

const mpCanvas = document.createElement('canvas');
mpCanvas.width = MP_W; mpCanvas.height = MP_H;
const mpCtx = mpCanvas.getContext('2d', { alpha: false });
const handSlots = { right: { lms: null, lastCenter: null }, left: { lms: null, lastCenter: null } };
function getHandCenter(lms) { return { x: (lms[0].x + lms[9].x) / 2, y: (lms[0].y + lms[9].y) / 2 }; }
function processHands(results) {
  const lmsArr = results.multiHandLandmarks || [];
  let rightDet = null, leftDet = null;
  if (lmsArr.length >= 2) {
    const sorted = [...lmsArr].sort((a, b) => getHandCenter(a).x - getHandCenter(b).x);
    rightDet = sorted[0]; leftDet = sorted[1];
  } else if (lmsArr.length === 1) {
    const lms = lmsArr[0], c = getHandCenter(lms), stR = handSlots.right, stL = handSlots.left;
    const dR = stR.lastCenter ? Math.hypot(c.x - stR.lastCenter.x, c.y - stR.lastCenter.y) : Infinity;
    const dL = stL.lastCenter ? Math.hypot(c.x - stL.lastCenter.x, c.y - stL.lastCenter.y) : Infinity;
    if (dR === Infinity && dL === Infinity) { if (c.x < 0.5) rightDet = lms; else leftDet = lms; }
    else if (dR <= dL) rightDet = lms;
    else leftDet = lms;
  }
  handSlots.right.lms = rightDet;
  handSlots.right.lastCenter = rightDet ? getHandCenter(rightDet) : null;
  handSlots.left.lms = leftDet;
  handSlots.left.lastCenter = leftDet ? getHandCenter(leftDet) : null;
}

async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      // 改为 environment 后置摄像头
      video: { facingMode: 'environment', width: { ideal: VIDEO_W }, height: { ideal: VIDEO_H } }, audio: false,
    });
    video.srcObject = stream;
    await video.play();
    if (video.videoWidth) updateLayout();
    video.addEventListener('loadedmetadata', updateLayout);
  } catch (e) { statusEl.textContent = '摄像头失败：' + e.name; }
}
let handsInstance = null, mpBusy = false, lastMpTime = 0, mpReady = false;
async function initHands() {
  if (typeof Hands === 'undefined') { statusEl.textContent = 'MediaPipe 库加载失败'; return; }
  const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
  // 后置摄像头 selfieMode 为 false
  hands.setOptions({ maxNumHands: 2, modelComplexity: IS_MOBILE ? 0 : 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.4, selfieMode: false });
  hands.onResults((r) => processHands(r));
  try { await hands.initialize(); handsInstance = hands; mpReady = true; } catch (e) { console.error(e); statusEl.textContent = 'MediaPipe 初始化失败'; }
}
function pumpMP() {
  if (mpBusy || !mpReady || video.readyState < 2) return;
  const now = performance.now();
  if (now - lastMpTime < MP_INTERVAL_MS) return;
  mpBusy = true; lastMpTime = now;
  mpCtx.drawImage(video, 0, 0, MP_W, MP_H);
  handsInstance.send({ image: mpCanvas }).then(() => { mpBusy = false; }).catch(() => { mpBusy = false; });
}

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
// 后置 AR 视角：需要从稍微高一点的地方往下看地面
let cameraY = 4.0, lookAtY = -2.0, cameraZ = 12.0, modelScale = 1.0, gridOpacity = 0.4;

function updateCamera() {
  camera.position.set(0, cameraY, cameraZ);
  camera.lookAt(0, lookAtY, 0);
  camera.updateProjectionMatrix();
}
updateCamera();

const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0xaaccff, 0.5);
fillLight.position.set(-5, 5, -5);
scene.add(fillLight);

const groundY = -2.5;
const gridHelper = new THREE.GridHelper(20, 40, 0x00d4ff, 0x0088aa);
gridHelper.position.y = groundY;
gridHelper.material.transparent = true;
gridHelper.material.opacity = gridOpacity;
scene.add(gridHelper);

const groundPlaneMat = new THREE.MeshBasicMaterial({ color: 0x004466, transparent: true, opacity: 0.15, side: THREE.DoubleSide, depthWrite: false });
const groundPlane = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), groundPlaneMat);
groundPlane.rotation.x = -Math.PI / 2;
groundPlane.position.y = groundY - 0.001;
scene.add(groundPlane);

function createShadowTexture() {
  const c = document.createElement('canvas'); c.width = 128; c.height = 128;
  const ct = c.getContext('2d');
  const gradient = ct.createRadialGradient(64, 64, 0, 64, 64, 64);
  gradient.addColorStop(0, 'rgba(0, 0, 0, 0.9)');
  gradient.addColorStop(0.4, 'rgba(0, 0, 0, 0.5)');
  gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ct.fillStyle = gradient; ct.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const shadowGeometry = new THREE.PlaneGeometry(1, 1);
const shadowMaterial = new THREE.MeshBasicMaterial({ map: createShadowTexture(), transparent: true, opacity: 0.6, depthWrite: false });
const shadowMesh = new THREE.Mesh(shadowGeometry, shadowMaterial);
shadowMesh.rotation.x = -Math.PI / 2;
shadowMesh.position.y = groundY + 0.01;
scene.add(shadowMesh);

const GRAVITY = -40.0;       
const RESTITUTION = 0.3;     
const MIN_VELOCITY = 1.0;    

const ballState = {
  position: new THREE.Vector3(0, groundY + 0.5, 0),
  velocity: new THREE.Vector3(0, 0, 0),
  isHeld: false,
  isFalling: false,
  isResting: true,
  releaseCooldown: 0,
  bounceCount: 0,            
  angularVelocity: new THREE.Vector3(0, 0, 0)
};
let currentGroundY = groundY;
let basketball = null, ballRadius = 0.5, ballLoaded = false;

const raycaster = new THREE.Raycaster();
const grabPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -0.2); 
const ndcRaycaster = new THREE.Raycaster();

const loader = new GLTFLoader();
loader.load('https://raw.githubusercontent.com/boluohejuju/1/refs/heads/main/stone.glb', (gltf) => {
  basketball = gltf.scene;
  const box = new THREE.Box3().setFromObject(basketball);
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const baseScale = 1.0 / maxDim;
  basketball.scale.set(baseScale, baseScale, baseScale);
  
  const box2 = new THREE.Box3().setFromObject(basketball);
  const center2 = box2.getCenter(new THREE.Vector3());
  
  const ballGroup = new THREE.Group();
  basketball.position.sub(center2);
  ballGroup.add(basketball);
  ballGroup.scale.set(modelScale, modelScale, modelScale);
  
  scene.add(ballGroup);
  basketball = ballGroup;
  
  const box3 = new THREE.Box3().setFromObject(basketball);
  const size3 = box3.getSize(new THREE.Vector3());
  ballRadius = Math.max(size3.x, size3.y, size3.z) * 0.5;
  
  ballLoaded = true;
  ballState.position.set(0, currentGroundY + ballRadius, 0);
  basketball.position.copy(ballState.position);
  shadowMesh.position.y = currentGroundY + 0.01;
}, undefined, (err) => {
  console.error('模型加载失败:', err);
  statusEl.textContent = '模型加载失败';
});

// 核心坐标计算（后置无 1-x 翻转）
function getActiveHand() { return handSlots.right.lms || handSlots.left.lms || null; }
function getPalmSize(lms) { return Math.hypot(lms[9].x - lms[0].x, lms[9].y - lms[0].y) || 0.1; }
function isFullyGrabbed(lms) {
  if (!lms) return false;
  const palmSize = getPalmSize(lms);
  const distToWrist = (idx) => Math.hypot(lms[idx].x - lms[0].x, lms[idx].y - lms[0].y) / palmSize;
  return distToWrist(8) < CONFIG.GRAB_DISTANCE_RATIO && distToWrist(12) < CONFIG.GRAB_DISTANCE_RATIO && 
         distToWrist(16) < CONFIG.GRAB_DISTANCE_RATIO && distToWrist(20) < CONFIG.GRAB_DISTANCE_RATIO;
}
function isHandOpen(lms) {
  if (!lms) return true;
  const palmSize = getPalmSize(lms);
  const distToWrist = (idx) => Math.hypot(lms[idx].x - lms[0].x, lms[idx].y - lms[0].y) / palmSize;
  return distToWrist(8) > CONFIG.RELEASE_DISTANCE_RATIO || distToWrist(12) > CONFIG.RELEASE_DISTANCE_RATIO;
}
// 后置无镜像
function getVisualHandPos(lms) { if (!lms) return null; return { x: lms[12].x, y: lms[12].y }; }
function getBallScreenPos() {
  const p = ballState.position.clone().project(camera);
  return { x: (1 + p.x) / 2, y: (1 - p.y) / 2 };
}
function getGrabTargetWorldPos(lms) {
  if (!lms) return null;
  const screenPos = nToC(lms[12].x, lms[12].y);
  const ndcX = (screenPos.x / window.innerWidth) * 2 - 1;
  const ndcY = -(screenPos.y / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(new THREE.Vector2(ndcX, ndcY), camera);
  const targetPos = new THREE.Vector3();
  raycaster.ray.intersectPlane(grabPlane, targetPos);
  return targetPos;
}
function getBallScreenRadius() {
  const p1 = ballState.position.clone().project(camera);
  const p2 = ballState.position.clone().add(new THREE.Vector3(ballRadius, 0, 0)).project(camera);
  return Math.abs(p1.x - p2.x) / 2;
}
function keepBallInsideScreen() {
  if (ballState.isHeld) return;
  const ndc = ballState.position.clone().project(camera);
  const pRight = ballState.position.clone().add(new THREE.Vector3(ballRadius, 0, 0)).project(camera);
  const pLeft = ballState.position.clone().add(new THREE.Vector3(-ballRadius, 0, 0)).project(camera);
  const pTop = ballState.position.clone().add(new THREE.Vector3(0, ballRadius, 0)).project(camera);
  const pBottom = ballState.position.clone().add(new THREE.Vector3(0, -ballRadius, 0)).project(camera);
  
  const rX = Math.abs(pRight.x - pLeft.x) / 2;
  const rY = Math.abs(pTop.y - pBottom.y) / 2;
  const padding = 0.02;
  const marginX = rX + padding;
  const marginY = rY + padding;
  
  let targetNdcX = ndc.x, targetNdcY = ndc.y;
  let hitX = false, hitY = false;
  
  if (ndc.x - marginX < -1) { targetNdcX = -1 + marginX; hitX = true; }
  else if (ndc.x + marginX > 1) { targetNdcX = 1 - marginX; hitX = true; }
  
  if (ndc.y + marginY > 1) { targetNdcY = 1 - marginY; hitY = true; }
  else if (ndc.y - marginY < -1) { targetNdcY = -1 + marginY; hitY = true; }
  
  if (hitX || hitY) {
      const zPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -ballState.position.z);
      ndcRaycaster.setFromCamera(new THREE.Vector2(targetNdcX, targetNdcY), camera);
      const newPos = new THREE.Vector3();
      ndcRaycaster.ray.intersectPlane(zPlane, newPos);
      ballState.position.copy(newPos);
  }
}function updateLogic(deltaTime) {
  if (!ballLoaded) return;
  if (ballState.releaseCooldown > 0) ballState.releaseCooldown -= deltaTime;
  
  const activeHand = getActiveHand();
  let debugStr = "无手";

  if (ballState.isHeld) {
    ballState.angularVelocity.set(0, 0, 0);
    if (!activeHand) {
      ballState.isHeld = false; ballState.isFalling = true; ballState.isResting = false;
      ballState.velocity.set(0, 0, 0); ballState.releaseCooldown = 0.5; ballState.bounceCount = 0;
      debugStr = "手离开-掉落";
    } else {
      if (isHandOpen(activeHand)) {
        ballState.isHeld = false; ballState.isFalling = true; ballState.isResting = false;
        ballState.velocity.set(0, 0, 0); ballState.releaseCooldown = 0.5; ballState.bounceCount = 0;
        debugStr = "松手砸下";
      } else {
        const targetPos = getGrabTargetWorldPos(activeHand);
        if (targetPos) ballState.position.copy(targetPos);
        debugStr = "抓取中";
      }
    }
  } else {
    if (activeHand && ballState.releaseCooldown <= 0) {
      const isGrabPose = isFullyGrabbed(activeHand);
      const handVisual = getVisualHandPos(activeHand);
      const ballScreen = getBallScreenPos();
      const screenDist = Math.hypot(handVisual.x - ballScreen.x, handVisual.y - ballScreen.y);
      if (isGrabPose) {
        debugStr = "手势正确";
        if (screenDist < CONFIG.GRAB_SCREEN_DIST) {
          ballState.isHeld = true; ballState.isFalling = false; ballState.isResting = false;
          ballState.velocity.set(0, 0, 0); ballState.bounceCount = 0;
          debugStr = "抓取成功";
          const targetPos = getGrabTargetWorldPos(activeHand);
          if (targetPos) ballState.position.copy(targetPos);
        } else {
          debugStr = "距离太远";
        }
      } else {
        debugStr = "手势未到位";
      }
    }

    if (!ballState.isHeld) {
      if (!ballState.isResting || ballState.velocity.length() > 0.01) {
        ballState.velocity.y += GRAVITY * deltaTime;
        ballState.position.addScaledVector(ballState.velocity, deltaTime);
        
        if (ballState.position.y <= currentGroundY + ballRadius) {
          ballState.position.y = currentGroundY + ballRadius; 
          if (ballState.velocity.y < -MIN_VELOCITY && ballState.bounceCount < 2) {
            ballState.velocity.y = -ballState.velocity.y * RESTITUTION;
            ballState.bounceCount++;
            ballState.velocity.x *= 0.8;
            ballState.angularVelocity.z = (Math.random() - 0.5) * 5;
            ballState.angularVelocity.x = (Math.random() - 0.5) * 5;
            debugStr = `弹跳第${ballState.bounceCount}次`;
          } else {
            ballState.velocity.set(0, 0, 0);
            ballState.isResting = true;
            ballState.isFalling = false;
            ballState.angularVelocity.multiplyScalar(0.5);
          }
        }
        
        if (ballState.isResting) {
            ballState.velocity.x *= 0.8;
            if (Math.abs(ballState.velocity.x) < 0.1) ballState.velocity.x = 0;
        } else {
            ballState.velocity.x *= 0.99;
        }
        keepBallInsideScreen();
      }
    }
  }

  if (basketball) {
    basketball.position.copy(ballState.position);
    if (!ballState.isHeld && ballState.angularVelocity.length() > 0.01) {
      basketball.rotateOnWorldAxis(new THREE.Vector3(0, 0, 1), ballState.angularVelocity.z * deltaTime);
      basketball.rotateOnWorldAxis(new THREE.Vector3(1, 0, 0), ballState.angularVelocity.x * deltaTime);
      ballState.angularVelocity.multiplyScalar(0.98);
    }
  }
  
  if (shadowMesh) {
    const height = Math.max(ballState.position.y - (currentGroundY + ballRadius), 0);
    const t = Math.min(height / 5, 1);
    const baseScale = ballRadius * 2.5 * 1.0;
    const currentScale = baseScale * (1 - t * 0.5);
    shadowMesh.scale.set(currentScale, currentScale, 1);
    shadowMesh.position.x = ballState.position.x;
    shadowMesh.position.z = ballState.position.z;
    shadowMaterial.opacity = Math.max(0.6 * (1 - t * 0.8), 0.05);
  }

  return debugStr;
}

// ============================================================
//  UI 骨架绘制与主循环
// ============================================================
let showSkeleton = false;
document.getElementById('toggleSkeleton').onclick = function() {
  showSkeleton = !showSkeleton;
  this.textContent = showSkeleton ? '骨架 ON' : '骨架 OFF';
};

function drawSkeleton(lms, isRight) {
  if (!lms) return;
  const strokeColor = isRight ? '#00ff44' : '#00d4ff';
  const tipColor = '#ffcc00', pointColor = '#ff1a1a';
  ctx.strokeStyle = strokeColor; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let k = 0; k < HAND_CONNECTIONS.length; k++) {
    const a = HAND_CONNECTIONS[k][0], b = HAND_CONNECTIONS[k][1];
    const pa = lms[a], pb = lms[b];
    if (!pa || !pb) continue;
    const A = nToC(pa.x, pa.y), B = nToC(pb.x, pb.y);
    ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y);
  }
  ctx.stroke();
  for (let idx = 0; idx < lms.length; idx++) {
    const p = lms[idx]; if (!p) continue;
    const P = nToC(p.x, p.y);
    ctx.fillStyle = HIGHLIGHT_POINTS.includes(idx) ? tipColor : pointColor;
    ctx.beginPath(); ctx.arc(P.x, P.y, HIGHLIGHT_POINTS.includes(idx) ? 5 : 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (let idx = 0; idx < lms.length; idx++) {
    const p = lms[idx]; if (!p) continue;
    const P = nToC(p.x, p.y);
    if (HIGHLIGHT_POINTS.includes(idx)) {
      const label = `${idx} ${KP_NAMES[idx]}`;
      ctx.font = `bold 12px ui-monospace, monospace`;
      const textW = ctx.measureText(label).width;
      const padX = 6, boxH = 20, offsetX = 10;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      if (ctx.roundRect) ctx.beginPath(), ctx.roundRect(P.x + offsetX, P.y - boxH / 2, textW + padX * 2, boxH, 4), ctx.fill();
      else ctx.fillRect(P.x + offsetX, P.y - boxH / 2, textW + padX * 2, boxH);
      ctx.strokeStyle = isRight ? 'rgba(0, 255, 68, 0.4)' : 'rgba(0, 212, 255, 0.4)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.fillText(label, P.x + offsetX + padX, P.y);
    } else {
      const label = `${idx}`;
      ctx.font = `bold 11px ui-monospace, monospace`;
      const tx = P.x + 6, ty = P.y - 6;
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.9)'; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.strokeText(label, tx, ty);
      ctx.fillStyle = '#ffffff'; ctx.fillText(label, tx, ty);
    }
  }
}

let lastFpsTime = performance.now(), framesSinceFps = 0, fps = 0, lastFrameTime = performance.now();
function loop() {
  try {
    const now = performance.now();
    const deltaTime = Math.min((now - lastFrameTime) / 1000, 0.05);
    lastFrameTime = now;
    pumpMP();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (showSkeleton) {
      if (handSlots.right.lms) drawSkeleton(handSlots.right.lms, true);
      if (handSlots.left.lms) drawSkeleton(handSlots.left.lms, false);
    }
    
    const debugState = updateLogic(deltaTime) || "";
    renderer.render(scene, camera);
    
    framesSinceFps++;
    if (now - lastFpsTime >= 1000) { fps = framesSinceFps; framesSinceFps = 0; lastFpsTime = now; }
    const ballStatus = ballState.isHeld ? '🪨抓取中' : (ballState.isFalling ? '⬇️下落/弹跳' : '⏸️静止');
    statusEl.textContent = `📱 ${fps}fps · ${debugState} · ${ballStatus}`;
    if (handSlots.right.lms || handSlots.left.lms) hintEl.style.opacity = '0';
  } catch (err) { console.error('loop error:', err); }
  requestAnimationFrame(loop);
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
}
window.addEventListener('resize', onWindowResize);

// ============================================================
// 参数面板交互逻辑
// ============================================================
const vCameraY = document.getElementById('vCameraY'), sCameraY = document.getElementById('sCameraY');
const vLookAtY = document.getElementById('vLookAtY'), sLookAtY = document.getElementById('sLookAtY');
const vCameraZ = document.getElementById('vCameraZ'), sCameraZ = document.getElementById('sCameraZ');
const vModelScale = document.getElementById('vModelScale'), sModelScale = document.getElementById('sModelScale');
const vGridOpacity = document.getElementById('vGridOpacity'), sGridOpacity = document.getElementById('sGridOpacity');

sCameraY.addEventListener('input', (e) => { cameraY = parseFloat(e.target.value); vCameraY.textContent = cameraY.toFixed(1); updateCamera(); });
sLookAtY.addEventListener('input', (e) => { lookAtY = parseFloat(e.target.value); vLookAtY.textContent = lookAtY.toFixed(1); updateCamera(); });
sCameraZ.addEventListener('input', (e) => { cameraZ = parseFloat(e.target.value); vCameraZ.textContent = cameraZ.toFixed(1); updateCamera(); });
sModelScale.addEventListener('input', (e) => {
  modelScale = parseFloat(e.target.value); vModelScale.textContent = modelScale.toFixed(2);
  if (basketball) {
    basketball.scale.setScalar(modelScale);
    const box = new THREE.Box3().setFromObject(basketball);
    ballRadius = Math.max(box.getSize(new THREE.Vector3()).x, box.getSize(new THREE.Vector3()).y, box.getSize(new THREE.Vector3()).z) * 0.5;
    if (ballState.isResting) { ballState.position.y = currentGroundY + ballRadius; basketball.position.copy(ballState.position); }
  }
});
sGridOpacity.addEventListener('input', (e) => { gridOpacity = parseFloat(e.target.value); vGridOpacity.textContent = gridOpacity.toFixed(2); gridHelper.material.opacity = gridOpacity; });

document.getElementById('copyParams').addEventListener('click', () => {
  const str = `cameraY: ${cameraY.toFixed(2)}, lookAtY: ${lookAtY.toFixed(2)}, cameraZ: ${cameraZ.toFixed(2)}, modelScale: ${modelScale.toFixed(2)}, gridOpacity: ${gridOpacity.toFixed(2)}`;
  navigator.clipboard.writeText(str).then(() => {
    const btn = document.getElementById('copyParams'); const old = btn.textContent;
    btn.textContent = '✅ 已复制'; setTimeout(() => btn.textContent = old, 1500);
  }).catch(() => alert('复制失败:\n' + str));
});

document.getElementById('resetParams').addEventListener('click', () => {
  cameraY = 4.0; lookAtY = -2.0; cameraZ = 12.0; modelScale = 1.0; gridOpacity = 0.4;
  sCameraY.value = cameraY; vCameraY.textContent = cameraY.toFixed(1);
  sLookAtY.value = lookAtY; vLookAtY.textContent = lookAtY.toFixed(1);
  sCameraZ.value = cameraZ; vCameraZ.textContent = cameraZ.toFixed(1);
  sModelScale.value = modelScale; vModelScale.textContent = modelScale.toFixed(2);
  sGridOpacity.value = gridOpacity; vGridOpacity.textContent = gridOpacity.toFixed(2);
  updateCamera(); gridHelper.material.opacity = gridOpacity;
  if (basketball) {
    basketball.scale.setScalar(modelScale);
    const box = new THREE.Box3().setFromObject(basketball);
    ballRadius = Math.max(box.getSize(new THREE.Vector3()).x, box.getSize(new THREE.Vector3()).y, box.getSize(new THREE.Vector3()).z) * 0.5;
    if (ballState.isResting) { ballState.position.y = currentGroundY + ballRadius; basketball.position.copy(ballState.position); }
  }
});

// 启动
(async () => {
  await initCamera();
  loop();
  await initHands();
})();
</script>
