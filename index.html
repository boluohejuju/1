<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>真实 AR SLAM 放置</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #fff;
    -webkit-user-select: none; user-select: none; touch-action: none; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  #three-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; }
  #ar-overlay { position: absolute; inset: 0; z-index: 4; }

  #status {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: rgba(255,255,255,0.9);
    z-index: 10; padding: 6px 14px; background: rgba(0,0,0,0.65); border-radius: 999px;
    white-space: nowrap; pointer-events: none;
  }
  #hint {
    position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%);
    padding: 10px 22px; background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 999px;
    font-size: 13px; transition: opacity 0.6s; z-index: 10; white-space: nowrap; pointer-events: none;
  }
  .btn {
    position: absolute; padding: 7px 14px; background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 999px;
    font-size: 11px; cursor: pointer; z-index: 10; white-space: nowrap;
  }
  #resetBtn { top: 20px; left: 16px; display: none; }
  #debugBtn { top: 20px; right: 16px; }

  #debugPanel {
    position: absolute; top: 60px; right: 16px; z-index: 50;
    background: rgba(20, 20, 20, 0.95); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px; padding: 16px; width: 280px; display: none; flex-direction: column; gap: 12px;
  }
  #startOverlay {
    position: absolute; inset: 0; z-index: 100;
    background: radial-gradient(circle at 50% 35%, #1a1030, #000 75%);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .start-card {
    max-width: 340px; width: 100%; text-align: center; padding: 28px 24px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 22px;
  }
  .start-card h1 { font-size: 21px; margin-bottom: 12px; }
  #startBtn {
    width: 100%; padding: 14px 0; font-size: 15px; font-weight: 700; color: #0a0a0a;
    background: linear-gradient(135deg, #a7f3d0, #6ee7b7); border: none; border-radius: 14px; margin-top: 15px;
  }
  #errorLog {
    color: #ff4d4d; font-size: 12px; margin-top: 10px; word-break: break-all;
    display: none; text-align: left; background: rgba(255,0,0,0.1); padding: 10px; border-radius: 8px;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="three-canvas"></canvas>
  <div id="ar-overlay"></div>

  <div id="status">准备就绪</div>
  <div id="hint">扫描桌面，点击绿环放置</div>
  <div class="btn" id="resetBtn">↺ 重新放置</div>

  <div id="startOverlay">
    <div class="start-card">
      <h1>🚀 真实 AR SLAM</h1>
      <p style="font-size:12px;color:#aaa;margin-bottom:10px;">如果启动失败，错误原因会显示在下方</p>
      <button id="startBtn">启动 AR</button>
      <div id="errorLog"></div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const MODEL_URL = 'https://raw.githubusercontent.com/boluohejuju/1/refs/heads/main/building.glb';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 200);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.xr.enabled = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 1.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

const ringGeo = new THREE.RingGeometry(0.08, 0.11, 32);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x4ade80, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
const hitRing = new THREE.Mesh(ringGeo, ringMat);
hitRing.rotation.x = -Math.PI / 2;
hitRing.visible = false;
scene.add(hitRing);

let xrSession = null, xrRefSpace = null, hitTestSource = null;
let xrHitMatrix = null, xrHitValid = false;
let flowerObj = null, placingMode = true;

// 加载模型
const loader = new GLTFLoader();
loader.load(MODEL_URL, (gltf) => {
    flowerObj = gltf.scene;
    const box = new THREE.Box3().setFromObject(flowerObj);
    const size = box.getSize(new THREE.Vector3());
    flowerObj.scale.setScalar(0.27 / (Math.max(size.x, size.y, size.z) || 1));

    const box2 = new THREE.Box3().setFromObject(flowerObj);
    flowerObj.position.sub(box2.getCenter(new THREE.Vector3()));

    const objGroup = new THREE.Group();
    objGroup.add(flowerObj);
    objGroup.visible = false;
    scene.add(objGroup);
    flowerObj = objGroup;
});

// 启动 AR
async function startAR() {
  const errorLog = document.getElementById('errorLog');
  errorLog.style.display = 'none';
  errorLog.textContent = '';

  if (!navigator.xr) {
    errorLog.textContent = '错误: 当前浏览器不支持 WebXR 模块。';
    errorLog.style.display = 'block';
    return false;
  }

  try {
    // 使用最基础的特性组合，避免 OPPO 系统拦截
    xrSession = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'] 
    });
  } catch (e) {
    errorLog.textContent = `底层报错: ${e.name} - ${e.message}`;
    errorLog.style.display = 'block';
    console.error(e);
    return false;
  }

  await renderer.xr.setSession(xrSession);
  xrRefSpace = await xrSession.requestReferenceSpace('viewer');
  hitTestSource = await xrSession.requestHitTestSource({ space: xrRefSpace });

  // 改用 local 空间，兼容性更好
  xrRefSpace = await xrSession.requestReferenceSpace('local');

  renderer.setAnimationLoop(xrLoop);
  return true;
}

document.getElementById('ar-overlay').addEventListener('pointerdown', () => {
  if (!placingMode || !xrSession || !xrHitValid) return;
  
  const m = new THREE.Matrix4().fromArray(xrHitMatrix);
  const hitPos = new THREE.Vector3().setFromMatrixPosition(m);

  if (flowerObj) {
    flowerObj.position.copy(hitPos);
    flowerObj.visible = true;
  }

  placingMode = false;
  hitRing.visible = false;
  document.getElementById('hint').textContent = '已锚定在真实世界';
  setTimeout(() => { document.getElementById('hint').style.opacity = '0'; }, 4000);
  document.getElementById('resetBtn').style.display = 'block';
  document.getElementById('status').textContent = '放置成功';
});

document.getElementById('resetBtn').addEventListener('click', () => {
  placingMode = true;
  if (flowerObj) flowerObj.visible = false;
  hitRing.visible = false;
  document.getElementById('status').textContent = '扫描平面中...';
  document.getElementById('hint').textContent = '移动手机扫描桌面';
  document.getElementById('hint').style.opacity = '1';
  document.getElementById('resetBtn').style.display = 'none';
});

function xrLoop(time, frame) {
  if (!frame) return;

  if (hitTestSource) {
    const hitResults = frame.getHitTestResults(hitTestSource);
    if (hitResults.length > 0) {
      const pose = hitResults[0].getPose(xrRefSpace);
      if (pose) {
        xrHitMatrix = pose.transform.matrix;
        xrHitValid = true;
        if (placingMode) {
          const m = new THREE.Matrix4().fromArray(xrHitMatrix);
          hitRing.position.setFromMatrixPosition(m);
          hitRing.position.y += 0.005;
          hitRing.visible = true;
          document.getElementById('hint').textContent = '平面已锁定 · 点击屏幕放置';
        }
      }
    } else {
      xrHitValid = false;
      if (placingMode) {
        hitRing.visible = false;
        document.getElementById('hint').textContent = '移动手机扫描桌面...';
      }
    }
  }
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

document.getElementById('startBtn').addEventListener('click', async () => {
  const startBtn = document.getElementById('startBtn');
  startBtn.textContent = '启动中...';
  startBtn.disabled = true;

  const ok = await startAR();
  if (ok) {
    document.getElementById('startOverlay').style.display = 'none';
  } else {
    startBtn.textContent = '启动失败';
    startBtn.disabled = false;
  }
});
</script>
</body>
</html>
