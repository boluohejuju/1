<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>真实 AR SLAM (iOS XRViewer 专属版)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #fff;
    -webkit-user-select: none; user-select: none; touch-action: none; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  #three-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; }
  
  #status {
    position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: rgba(255,255,255,0.9);
    z-index: 10; padding: 6px 14px; background: rgba(0,0,0,0.65); border-radius: 999px;
    white-space: nowrap; font-family: monospace; pointer-events: none;
  }
  #hint {
    position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
    padding: 10px 22px; background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 999px;
    font-size: 14px; color: rgba(255,255,255,0.85);
    z-index: 10; text-align: center; white-space: nowrap; pointer-events: none;
  }
  
  #startOverlay {
    position: absolute; inset: 0; z-index: 100;
    background: radial-gradient(circle at 50% 35%, #1a1030, #000 75%);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .start-card {
    max-width: 340px; width: 100%; text-align: center; padding: 28px 24px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 22px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .start-card h1 { font-size: 21px; font-weight: 700; margin-bottom: 12px; }
  .start-card p { font-size: 13px; line-height: 1.65; color: rgba(255,255,255,0.72); margin-bottom: 20px; }
  #startBtn {
    width: 100%; padding: 14px 0; font-size: 15px; font-weight: 700; color: #0a0a0a;
    background: linear-gradient(135deg, #a7f3d0, #6ee7b7); border: none; border-radius: 14px; cursor: pointer;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="three-canvas"></canvas>
  <div id="status">准备就绪</div>
  <div id="hint">扫描桌面，点击绿环放置</div>

  <div id="startOverlay">
    <div class="start-card">
      <h1>🚀 ARKit 真实 SLAM</h1>
      <p>苹果专属体验<br>移动手机扫描桌面放置模型</p>
      <button id="startBtn">启动 AR 体验</button>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

let CONFIG = { SCALE: 0.27 };
// 你的模型链接
const MODEL_URL = 'https://raw.githubusercontent.com/boluohejuju/1/refs/heads/main/building.glb';

const statusEl = document.getElementById('status');
const hintEl = document.getElementById('hint');
const threeCanvas = document.getElementById('three-canvas');

// ================= Three.js 核心 =================
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 200);
const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.xr.enabled = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 1.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

// 绿环
const ringGeo = new THREE.RingGeometry(0.08, 0.11, 32);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x4ade80, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
const hitRing = new THREE.Mesh(ringGeo, ringMat);
hitRing.rotation.x = -Math.PI / 2;
hitRing.visible = false;
scene.add(hitRing);

let xrSession = null, xrRefSpace = null, hitTestSource = null;
let xrHitMatrix = null, xrHitValid = false;

let flowerObj = null, modelLoaded = false;
let placingMode = true;

// 加载模型
statusEl.textContent = '正在加载模型...';
const loader = new GLTFLoader();
loader.load(MODEL_URL, (gltf) => {
    flowerObj = gltf.scene;
    const box = new THREE.Box3().setFromObject(flowerObj);
    const size = box.getSize(new THREE.Vector3());
    flowerObj.scale.setScalar(CONFIG.SCALE / (Math.max(size.x, size.y, size.z) || 1));

    const box2 = new THREE.Box3().setFromObject(flowerObj);
    flowerObj.position.sub(box2.getCenter(new THREE.Vector3()));

    const objGroup = new THREE.Group();
    objGroup.add(flowerObj);
    objGroup.visible = false;
    scene.add(objGroup);
    flowerObj = objGroup;
    
    modelLoaded = true;
    statusEl.textContent = '模型加载成功';
}, undefined, () => { statusEl.textContent = '模型加载失败，请检查链接'; });

// 启动 AR
async function startAR() {
  if (!navigator.xr) { alert('XRViewer 未准备好'); return false; }
  try {
    // 苹果 XRViewer 支持的标准参数
    xrSession = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['local-floor']
    });
  } catch (e) {
    console.error("启动错误:", e);
    alert('启动失败: ' + e.message);
    return false;
  }

  await renderer.xr.setSession(xrSession);
  
  // 苹果默认用 local 空间
  xrRefSpace = await xrSession.requestReferenceSpace('local');
  
  const viewerSpace = await xrSession.requestReferenceSpace('viewer');
  hitTestSource = await xrSession.requestHitTestSource({ space: viewerSpace });

  renderer.setAnimationLoop(xrLoop);
  return true;
}

// 点击放置
threeCanvas.addEventListener('pointerdown', () => {
  if (!placingMode || !xrSession || !xrHitValid) return;
  
  const m = new THREE.Matrix4().fromArray(xrHitMatrix);
  const hitPos = new THREE.Vector3().setFromMatrixPosition(m);

  if (flowerObj) {
    flowerObj.position.copy(hitPos);
    flowerObj.visible = true;
  }

  placingMode = false;
  hitRing.visible = false;
  hintEl.textContent = '模型已锚定，走动查看';
  statusEl.textContent = '放置成功';
});

// ================= 渲染循环 =================
function xrLoop(time, frame) {
  if (!frame) return;

  // 平面扫描
  if (hitTestSource) {
    const hitResults = frame.getHitTestResults(hitTestSource);
    if (hitResults.length > 0) {
      const pose = hitResults[0].getPose(xrRefSpace);
      if (pose) {
        xrHitMatrix = pose.transform.matrix;
        xrHitValid = true;
        if (placingMode) {
          const m = new THREE.Matrix4().fromArray(xrHitMatrix);
          hitRing.position.setFromMatrixPosition(m);
          hitRing.position.y += 0.005;
          hitRing.visible = true;
          hintEl.textContent = '平面已锁定 · 点击屏幕放置';
        }
      }
    } else {
      xrHitValid = false;
      if (placingMode) {
        hitRing.visible = false;
        hintEl.textContent = '移动手机扫描桌面...';
      }
    }
  }

  renderer.render(scene, camera);
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onWindowResize);

document.getElementById('startBtn').addEventListener('click', async () => {
  const startBtn = document.getElementById('startBtn');
  startBtn.textContent = '启动中...';
  startBtn.disabled = true;

  const ok = await startAR();
  if (ok) {
    document.getElementById('startOverlay').style.display = 'none';
  } else {
    startBtn.textContent = '启动失败，点击重试';
    startBtn.disabled = false;
  }
});
</script>
</body>
</html>
