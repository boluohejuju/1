<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>真实 AR 平面放置 · 手势抓取模型</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #fff;
    -webkit-user-select: none; user-select: none; touch-action: none; }
  #stage { position: relative; width: 100vw; height: 100vh; }

  #video, #canvas, #three-canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }

  #video { z-index: 1; }
  #three-canvas { z-index: 2; pointer-events: none; }
  #canvas { z-index: 3; pointer-events: none; }
  #ar-overlay { position: absolute; inset: 0; z-index: 4; }

  #status {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: rgba(255,255,255,0.9); letter-spacing: 0.05em;
    z-index: 10; padding: 6px 14px; background: rgba(0,0,0,0.65); border-radius: 999px;
    white-space: nowrap; font-family: ui-monospace, monospace;
    pointer-events: none;
  }
  #hint {
    position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%);
    padding: 10px 22px; background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 999px;
    font-size: 13px; color: rgba(255,255,255,0.85);
    transition: opacity 0.6s; z-index: 10; text-align: center; white-space: nowrap;
    pointer-events: none;
  }
  .btn {
    position: absolute;
    padding: 7px 14px; background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 999px;
    font-size: 11px; color: rgba(255,255,255,0.9); cursor: pointer;
    z-index: 10; user-select: none; white-space: nowrap;
  }
  .btn:active { background: rgba(255,255,255,0.25); }

  #resetBtn { top: 20px; left: 16px; display: none; }
  #debugBtn { top: 20px; right: 100px; background: rgba(255, 100, 0, 0.3); border-color: rgba(255, 100, 0, 0.5); }
  #toggleSkeleton { top: 20px; right: 16px; }

  #debugPanel {
    position: absolute; top: 60px; right: 16px; z-index: 50;
    background: rgba(20, 20, 20, 0.95);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 12px;
    padding: 16px; width: 280px;
    display: none; flex-direction: column; gap: 12px;

  }

    width: 100%; padding: 8px 0; font-size: 12px; font-weight: 600;

    border: none; border-radius: 8px; cursor: pointer; margin-top: 4px;

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

let CONFIG = {
  SCALE: 0.27,
  GROUND_Y: -2.0,
  CAMERA_Y: 0.0,
  CAMERA_PITCH: 0,
  CAMERA_FOV: 60,
  GRAB_DISTANCE_RATIO: 1.6,
  RELEASE_DISTANCE_RATIO: 2.0,
  GRAB_SCREEN_DIST: 0.28,
};

const MODEL_URL = 'https://raw.githubusercontent.com/boluohejuju/1/refs/heads/main/building.glb';

const video    = document.getElementById('video');
const canvas   = document.getElementById('canvas');
const ctx      = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const hintEl   = document.getElementById('hint');
const threeCanvas = document.getElementById('three-canvas');
const overlayEl = document.getElementById('ar-overlay');
const reticleEl = document.getElementById('reticle');
const resetBtn = document.getElementById('resetBtn');

const debugBtn = document.getElementById('debugBtn');
const debugPanel = document.getElementById('debugPanel');
const debugOutput = document.getElementById('debugOutput');

debugBtn.addEventListener('click', () => {
  debugPanel.style.display = debugPanel.style.display === 'flex' ? 'none' : 'flex';
});

function buildConfigText() {
  return `const CONFIG = {
  SCALE: ${CONFIG.SCALE.toFixed(2)},
  GROUND_Y: ${CONFIG.GROUND_Y.toFixed(1)},
  CAMERA_Y: ${CONFIG.CAMERA_Y.toFixed(1)},
  CAMERA_PITCH: ${CONFIG.CAMERA_PITCH.toFixed(0)},
  CAMERA_FOV: ${CONFIG.CAMERA_FOV.toFixed(0)},
  GRAB_DISTANCE_RATIO: ${CONFIG.GRAB_DISTANCE_RATIO.toFixed(2)},
  RELEASE_DISTANCE_RATIO: ${CONFIG.RELEASE_DISTANCE_RATIO.toFixed(2)},
  GRAB_SCREEN_DIST: ${CONFIG.GRAB_SCREEN_DIST.toFixed(2)}
};`;
}

function updateOutput() {
  const text = buildConfigText();
  debugOutput.innerHTML = text.replace(/\n/g, '<br>').replace(/ /g, '&nbsp;');
}

document.getElementById('copyParamsBtn').addEventListener('click', async () => {
  const text = buildConfigText();
  try {
    await navigator.clipboard.writeText(text);
    const btn = document.getElementById('copyParamsBtn');
    const old = btn.textContent;
    btn.textContent = '✅ 已复制';
    setTimeout(() => { btn.textContent = old; }, 1200);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    document.body.removeChild(ta);
    const btn = document.getElementById('copyParamsBtn');
    const old = btn.textContent;
    btn.textContent = '✅ 已复制';
    setTimeout(() => { btn.textContent = old; }, 1200);
  }
});

document.getElementById('camYSlider').addEventListener('input', (e) => { CONFIG.CAMERA_Y = parseFloat(e.target.value); document.getElementById('camYVal').innerText = CONFIG.CAMERA_Y.toFixed(1); updateOutput(); });
document.getElementById('camPitchSlider').addEventListener('input', (e) => { CONFIG.CAMERA_PITCH = parseFloat(e.target.value); document.getElementById('camPitchVal').innerText = CONFIG.CAMERA_PITCH + '°'; updateOutput(); });
document.getElementById('fovSlider').addEventListener('input', (e) => { CONFIG.CAMERA_FOV = parseFloat(e.target.value); document.getElementById('fovVal').innerText = CONFIG.CAMERA_FOV + '°'; camera.fov = CONFIG.CAMERA_FOV; camera.updateProjectionMatrix(); updateOutput(); });
document.getElementById('groundYSlider').addEventListener('input', (e) => { CONFIG.GROUND_Y = parseFloat(e.target.value); document.getElementById('groundYVal').innerText = CONFIG.GROUND_Y.toFixed(1); gridHelper.position.y = CONFIG.GROUND_Y; updateOutput(); });
document.getElementById('scaleSlider').addEventListener('input', (e) => {
  CONFIG.SCALE = parseFloat(e.target.value);
  document.getElementById('scaleVal').innerText = CONFIG.SCALE.toFixed(2);
  if (flowerObj) {
    const box1 = new THREE.Box3().setFromObject(flowerObj);
    const s1 = box1.getSize(new THREE.Vector3());
    const max1 = Math.max(s1.x, s1.y, s1.z) || 1;
    const k = CONFIG.SCALE / max1;
    flowerObj.scale.setScalar(k);
    const box2 = new THREE.Box3().setFromObject(flowerObj);
    const s2 = box2.getSize(new THREE.Vector3());
    objRadius = Math.max(s2.x, s2.y, s2.z) * 0.5;
  }
  updateOutput();
});
document.getElementById('grabDistSlider').addEventListener('input', (e) => {
  CONFIG.GRAB_SCREEN_DIST = parseFloat(e.target.value);
  document.getElementById('grabDistVal').innerText = CONFIG.GRAB_SCREEN_DIST.toFixed(2);
  updateOutput();
});
document.getElementById('grabRatioSlider').addEventListener('input', (e) => {
  CONFIG.GRAB_DISTANCE_RATIO = parseFloat(e.target.value);
  document.getElementById('grabRatioVal').innerText = CONFIG.GRAB_DISTANCE_RATIO.toFixed(2);
  updateOutput();
});
updateOutput();

const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
const VIDEO_W = IS_MOBILE ? 640 : 1280;
const VIDEO_H = IS_MOBILE ? 480 : 720;
const MP_W = 160; const MP_H = 120;

const HIGHLIGHT_POINTS = [4, 8, 12, 16, 20, 0];
const HAND_CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

let layout = { offsetX: 0, offsetY: 0, drawW: 1, drawH: 1 };
function updateLayout() {
  const vw = video.videoWidth || VIDEO_W, vh = video.videoHeight || VIDEO_H;
  const cssW = window.innerWidth, cssH = window.innerHeight;
  const DPR = window.devicePixelRatio || 1;
  if (canvas.width !== cssW * DPR || canvas.height !== cssH * DPR) {
    canvas.width = cssW * DPR; canvas.height = cssH * DPR;
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const videoAspect = vw / vh, displayAspect = cssW / cssH;
  let drawW, drawH, offsetX, offsetY;
  if (displayAspect > videoAspect) {
    drawW = cssW; drawH = cssW / videoAspect; offsetX = 0; offsetY = (cssH - drawH) / 2;
  } else {
    drawH = cssH; drawW = cssH * videoAspect; offsetX = (cssW - drawW) / 2; offsetY = 0;
  }
  layout = { offsetX, offsetY, drawW, drawH };
}
window.addEventListener('resize', () => { updateLayout(); onWindowResize(); });
window.addEventListener('orientationchange', () => setTimeout(() => { updateLayout(); onWindowResize(); }, 250));

function nToC(nx, ny) {
  return { x: layout.offsetX + nx * layout.drawW, y: layout.offsetY + ny * layout.drawH };
}

const mpCanvas = document.createElement('canvas');
mpCanvas.width = MP_W; mpCanvas.height = MP_H;
const mpCtx = mpCanvas.getContext('2d', { alpha: false });
const handSlots = { right: { lms: null }, left: { lms: null } };

function getHandCenter(lms) { return { x: (lms[0].x + lms[9].x) / 2, y: (lms[0].y + lms[9].y) / 2 }; }

function processHands(results) {
  const lmsArr = results.multiHandLandmarks || [];
  let rightDet = null, leftDet = null;
  if (lmsArr.length >= 2) {
    const sorted = [...lmsArr].sort((a, b) => getHandCenter(a).x - getHandCenter(b).x);
    rightDet = sorted[0]; leftDet = sorted[1];
  } else if (lmsArr.length === 1) {
    const lms = lmsArr[0], c = getHandCenter(lms);
    if (c.x < 0.5) rightDet = lms; else leftDet = lms;
  }
  handSlots.right.lms = rightDet;
  handSlots.left.lms = leftDet;
}

let handsInstance = null, mpBusy = false, lastMpTime = 0, mpReady = false;
async function initHands() {
  if (typeof Hands === 'undefined') return;
  const hands = new Hands({ locateFile: (f) => `https://unpkg.com/@mediapipe/hands/${f}` });
  hands.setOptions({ maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.4, selfieMode: false });
  hands.onResults((r) => processHands(r));
  try { await hands.initialize(); handsInstance = hands; mpReady = true; } catch (e) { console.error(e); }
}

function pumpMP() {
  if (mpBusy || !mpReady || video.readyState < 2) return;
  const now = performance.now();
  if (now - lastMpTime < 66) return;
  mpBusy = true; lastMpTime = now;
  mpCtx.drawImage(video, 0, 0, MP_W, MP_H);
  handsInstance.send({ image: mpCanvas }).then(() => { mpBusy = false; }).catch(() => { mpBusy = false; });
}

async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: VIDEO_W }, height: { ideal: VIDEO_H } }, audio: false,
    });
    video.srcObject = stream;
    await video.play();
    if (video.videoWidth) updateLayout();
    video.addEventListener('loadedmetadata', updateLayout);
    return true;
  } catch (e) {
    statusEl.textContent = '摄像头失败：' + e.name;
    return false;
  }
}

// ================= WebXR / SLAM =================
let xrSession = null, xrRefSpace = null, hitTestSource = null;
let xrSupported = false;
let xrHitMatrix = null, xrHitValid = false;
let xrActive = false;

async function initWebXR() {
  if (!navigator.xr) return false;
  try { xrSupported = await navigator.xr.isSessionSupported('immersive-ar'); }
  catch (e) { xrSupported = false; }
  return xrSupported;
}

async function startXRSession() {
  if (!xrSupported) return false;
  try {
    xrSession = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test', 'local-floor'],
      optionalFeatures: ['dom-overlay'],
      domOverlay: { root: document.getElementById('stage') }
    });
  } catch (e) {
    console.warn('WebXR 会话启动失败:', e);
    return false;
  }

  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local-floor');
  await renderer.xr.setSession(xrSession);

  xrRefSpace = await xrSession.requestReferenceSpace('local-floor');
  const viewerSpace = await xrSession.requestReferenceSpace('viewer');
  hitTestSource = await xrSession.requestHitTestSource({ space: viewerSpace });

  video.style.display = 'none';
  threeCanvas.style.display = 'block';
  xrActive = true;

  xrSession.addEventListener('end', () => {
    xrSession = null;
    hitTestSource = null;
    renderer.xr.enabled = false;
    video.style.display = 'block';
    xrActive = false;
    enterPlacingMode();
  });

  return true;
}

function updateXRHitTest(frame) {
  if (!hitTestSource || !frame) return;
  const hitResults = frame.getHitTestResults(hitTestSource);
  if (hitResults.length > 0) {
    const pose = hitResults[0].getPose(xrRefSpace);
    if (pose) {
      xrHitMatrix = pose.transform.matrix;
      xrHitValid = true;
      return;
    }
  }
  xrHitValid = false;
  xrHitMatrix = null;
}

function getXRHitPoint() {
  if (!xrHitValid || !xrHitMatrix) return null;
  const m = new THREE.Matrix4().fromArray(xrHitMatrix);
  return new THREE.Vector3().setFromMatrixPosition(m);
}
// =================================================

// Three.js
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(CONFIG.CAMERA_FOV, window.innerWidth / window.innerHeight, 0.05, 200);
const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.xr.enabled = false;

scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 1.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);
scene.add(new THREE.AmbientLight(0xffffff, 1.0));

const gridHelper = new THREE.GridHelper(10, 10, 0x00ff00, 0x444444);
gridHelper.position.y = CONFIG.GROUND_Y;
gridHelper.visible = false;
scene.add(gridHelper);

const ringGeo = new THREE.RingGeometry(0.08, 0.11, 32);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x4ade80, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
const hitRing = new THREE.Mesh(ringGeo, ringMat);
hitRing.rotation.x = -Math.PI / 2;
hitRing.visible = false;
scene.add(hitRing);

let gyroReady = false;
let baseQuat = new THREE.Quaternion();

function onDeviceOrientation(e) {
  if (e.alpha === null || e.beta === null || e.gamma === null) return;
  const alpha = THREE.MathUtils.degToRad(e.alpha);
  const beta  = THREE.MathUtils.degToRad(e.beta);
  const gamma = THREE.MathUtils.degToRad(e.gamma);
  const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
  baseQuat.setFromEuler(euler);
  baseQuat.multiply(new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)));
  let angle = 0;
  if (screen.orientation && typeof screen.orientation.angle === 'number') angle = screen.orientation.angle;
  else if (typeof window.orientation === 'number') angle = window.orientation;
  baseQuat.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), -THREE.MathUtils.degToRad(angle)));
  gyroReady = true;
}

function createShadowTexture() {
  const c = document.createElement('canvas'); c.width = 128; c.height = 128;
  const ct = c.getContext('2d');
  const gradient = ct.createRadialGradient(64, 64, 0, 64, 64, 64);
  gradient.addColorStop(0, 'rgba(0, 0, 0, 0.9)');
  gradient.addColorStop(0.4, 'rgba(0, 0, 0, 0.5)');
  gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ct.fillStyle = gradient; ct.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const shadowMaterial = new THREE.MeshBasicMaterial({ map: createShadowTexture(), transparent: true, opacity: 0.6, depthWrite: false });
const shadowMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), shadowMaterial);
shadowMesh.rotation.x = -Math.PI / 2;
shadowMesh.position.y = CONFIG.GROUND_Y + 0.01;
shadowMesh.visible = false;
scene.add(shadowMesh);

const raycaster = new THREE.Raycaster();
const tmpHit = new THREE.Vector3();
const tmpNdc = new THREE.Vector2();

function screenToGround(clientX, clientY) {
  tmpNdc.set((clientX / window.innerWidth) * 2 - 1, -(clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(tmpNdc, camera);
  const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -CONFIG.GROUND_Y);
  const hitPoint = new THREE.Vector3();
  const ok = raycaster.ray.intersectPlane(groundPlane, hitPoint);
  if (!ok) return null;
  const dist = hitPoint.distanceTo(camera.position);
  if (dist > 0.1 && dist < 30) {
    if (hitPoint.y < CONFIG.GROUND_Y - 5) return null;
    return hitPoint.clone();
  }
  return null;
}

const GRAVITY = -2.8;
const AIR_DRAG_Y = 0.9;
const AIR_DRAG_X = 1.2;
const BOUNCE_RESTITUTION = 0.35;
const MAX_BOUNCE_COUNT = 2;

// ★ 删除内置占位模型，只加载 building.glb

function setupObject(obj) {
  if (currentObjGroup) {
    scene.remove(currentObjGroup);
    currentObjGroup.traverse((child) => {
      if (child.geometry) child.geometry.dispose();
      if (child.material) {
        if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
        else child.material.dispose();
      }
    });
    currentObjGroup = null;
  }

  flowerObj = obj;
  const box = new THREE.Box3().setFromObject(flowerObj);
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const k = CONFIG.SCALE / maxDim;
  flowerObj.scale.setScalar(k);

  const box2 = new THREE.Box3().setFromObject(flowerObj);
  const center2 = box2.getCenter(new THREE.Vector3());
  flowerObj.position.sub(center2);

  const objGroup = new THREE.Group();
  objGroup.add(flowerObj);
  objGroup.visible = false;
  scene.add(objGroup);

  currentObjGroup = objGroup;
  flowerObj = objGroup;

  const box3 = new THREE.Box3().setFromObject(flowerObj);
  const size3 = box3.getSize(new THREE.Vector3());
  objRadius = Math.max(size3.x, size3.y, size3.z) * 0.5;
  modelLoaded = true;
}

statusEl.textContent = '正在加载 building.glb...';

const loader = new GLTFLoader();
loader.load(
  MODEL_URL,
  (gltf) => {
    setupObject(gltf.scene);
    statusEl.textContent = 'building.glb 加载成功';
  },
  (xhr) => {
    if (xhr.total > 0) statusEl.textContent = `加载 building.glb ${Math.round((xhr.loaded / xhr.total) * 100)}%`;
  },
  (err) => {
    console.error('building.glb 加载失败:', err);
    statusEl.textContent = 'building.glb 加载失败，请检查链接';
  }
);

function getActiveHand() { return handSlots.right.lms || handSlots.left.lms || null; }
function getPalmPoint(lms) { return lms[9]; }
function getPalmSize(lms) { return Math.hypot(lms[9].x - lms[0].x, lms[9].y - lms[0].y) || 0.1; }

function isFullyGrabbed(lms) {
  if (!lms) return false;
  const p = getPalmSize(lms);
  const wrist = lms[0];
  const tips = [4, 8, 12, 16, 20];
  let closedCount = 0;
  for (const idx of tips) {
    const tip = lms[idx];
    const d = Math.hypot(tip.x - wrist.x, tip.y - wrist.y) / p;
    if (d < CONFIG.GRAB_DISTANCE_RATIO) closedCount++;
  }
  return closedCount >= 4;
}
